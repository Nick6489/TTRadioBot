# Headless TeamTalk SDK device probes only. Radio PCM is injected directly
# into TeamTalk; local playback is discarded and capture produces silence.
# Deliberately standalone: do not enumerate absent hardware or PulseAudio.
pcm.default {
    type null
    hint {
        show on
        description "Headless TeamTalk default"
    }
}
pcm.sysdefault { type null }
pcm.dmix { type null }
